<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BimDex – Linz Straßenbahn Sammelpass</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #D85A30; --orange-light: #FAECE7; --orange-dark: #4A1B0C;
      --grau: #8a8a85; --bg: #ffffff; --bg2: #f5f4f0;
      --border: rgba(0,0,0,0.12); --txt: #1a1a18; --txt2: #6b6a66;
      --radius-md: 8px; --radius-lg: 12px; --danger: #E24B4A; --gruen: #1D9E75;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1c1a; --bg2: #252522; --border: rgba(255,255,255,0.12); --txt: #f0efe8; --txt2: #999890; --orange-light: #3a1a0d; --orange-dark: #f5c4b3; }
    }
    body { font-family: "Syne", sans-serif; background: var(--bg2); color: var(--txt); min-height: 100vh; }
    .page { display: none; }
    .page.aktiv { display: block; }

    /* ── AUTH ── */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .auth-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 380px; }
    .auth-title { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--orange); margin-bottom: 4px; }
    .auth-subtitle { font-size: 12px; font-family: "Space Mono", monospace; color: var(--txt2); margin-bottom: 1.5rem; }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; border: 0.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .auth-tab { flex: 1; padding: 8px; font-family: "Syne", sans-serif; font-size: 13px; font-weight: 700; background: transparent; border: none; cursor: pointer; color: var(--txt2); transition: all 0.15s; }
    .auth-tab.aktiv { background: var(--orange); color: #fff; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 12px; font-family: "Space Mono", monospace; color: var(--txt2); }
    .field input { font-family: "Syne", sans-serif; font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: var(--bg2); color: var(--txt); outline: none; transition: border-color 0.15s; width: 100%; }
    .field input:focus { border-color: var(--orange); }
    .btn-primary { width: 100%; padding: 12px; background: var(--orange); color: #fff; border: none; border-radius: var(--radius-md); font-family: "Syne", sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error { font-size: 12px; color: var(--danger); font-family: "Space Mono", monospace; margin-top: 8px; min-height: 16px; }

    /* ── HAUPT-APP ── */
    .container { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; gap: 12px; flex-wrap: wrap; }
    .title { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--orange); }
    .subtitle { font-size: 13px; font-family: "Space Mono", monospace; color: var(--txt2); margin-top: 5px; }
    .header-rechts { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .stats { display: flex; gap: 8px; }
    .stat { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 8px 16px; text-align: center; min-width: 76px; }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--orange); font-family: "Space Mono", monospace; }
    .stat-label { font-size: 11px; font-family: "Space Mono", monospace; color: var(--txt2); margin-top: 2px; }
    .btn-logout { font-size: 11px; font-family: "Space Mono", monospace; color: var(--txt2); background: transparent; border: 0.5px solid var(--border); border-radius: 99px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* ── FORTSCHRITTSBALKEN ── */
    .progress-label { font-size: 12px; font-family: "Space Mono", monospace; color: var(--txt2); margin-bottom: 6px; }
    .progress-bar-wrap { background: var(--bg); border-radius: 99px; height: 8px; margin-bottom: 1.75rem; overflow: hidden; border: 0.5px solid var(--border); position: relative; }
    .progress-bar-fill { height: 100%; background: var(--orange); border-radius: 99px; transition: width 0.6s cubic-bezier(0.34,1.2,0.64,1); }

    /* ── UPLOAD FORTSCHRITTSBALKEN ── */
    .upload-bar-wrap { height: 4px; background: var(--border); border-radius: 99px; margin-top: 8px; overflow: hidden; display: none; }
    .upload-bar-fill { height: 100%; background: var(--gruen); border-radius: 99px; width: 0%; transition: width 0.2s ease; }

    /* ── FORMULAR ── */
    .form-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }
    .form-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--txt); }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 120px; }
    .form-group label { font-size: 12px; font-family: "Space Mono", monospace; color: var(--txt2); }
    input[type="number"], input[type="text"] { font-family: "Syne", sans-serif; font-size: 14px; padding: 8px 10px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: var(--bg2); color: var(--txt); outline: none; width: 100%; transition: border-color 0.15s; }
    input:focus { border-color: var(--orange); }
    input[type="number"] { max-width: 110px; }
    #inp-foto { display: none; }
    .btn-foto { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; font-family: "Syne", sans-serif; font-size: 13px; color: var(--txt2); cursor: pointer; transition: all 0.15s; }
    .btn-foto:hover { border-color: var(--orange); color: var(--orange); }
    .btn-foto.hat-foto { border-color: var(--gruen); color: var(--gruen); background: #e6f5f0; }
    #foto-vorschau { width: 100%; max-height: 100px; object-fit: cover; border-radius: var(--radius-md); border: 0.5px solid var(--border); display: none; margin-top: 6px; }
    .btn-add { background: var(--orange); color: #fff; border: none; border-radius: var(--radius-md); padding: 10px 20px; font-family: "Syne", sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: opacity 0.15s, transform 0.1s; flex-shrink: 0; }
    .btn-add:hover { opacity: 0.85; }
    .btn-add:active { transform: scale(0.97); }
    .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-error { font-size: 12px; color: var(--danger); font-family: "Space Mono", monospace; margin-top: 8px; min-height: 16px; }

    /* ── FILTER ── */
    .filter-row { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
    .filter-label { font-size: 12px; font-family: "Space Mono", monospace; color: var(--txt2); }
    .filter-btn { background: transparent; border: 0.5px solid var(--border); border-radius: 99px; padding: 4px 14px; font-family: "Space Mono", monospace; font-size: 12px; cursor: pointer; color: var(--txt2); transition: all 0.15s; }
    .filter-btn.aktiv { background: var(--orange); border-color: var(--orange); color: #fff; }
    .filter-btn:hover:not(.aktiv) { border-color: var(--orange); color: var(--orange); }

    /* ── GRID & KARTEN ── */
    .serie-label { font-size: 11px; font-family: "Space Mono", monospace; color: var(--txt2); letter-spacing: 1px; text-transform: uppercase; margin: 1.25rem 0 0.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

    .bim-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px; position: relative; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; }
    .bim-card.gefunden { animation: einblenden 0.3s ease both; }
    .bim-card.gefunden:hover { border-color: var(--orange); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(216,90,48,0.12); }

    /* Wackeln bei offenem Antippen */
    .bim-card.offen { opacity: 0.42; cursor: pointer; }
    .bim-card.offen:hover { opacity: 0.65; }
    .bim-card.offen.wackeln { animation: wackeln 0.4s ease; }
    .bim-card.offen .bim-card-num { color: var(--grau); }

    @keyframes einblenden { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes wackeln { 0%,100% { transform: rotate(0deg); } 20% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } 75% { transform: rotate(-2deg); } }

    /* Skeleton-Platzhalter beim Laden */
    .skeleton { background: linear-gradient(90deg, var(--bg2) 25%, var(--border) 50%, var(--bg2) 75%); background-size: 200% 100%; animation: skeleton-shimmer 1.2s infinite; border-radius: var(--radius-md); }
    @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-karte { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px; }
    .skeleton-foto { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md); margin-bottom: 8px; }
    .skeleton-num { height: 28px; width: 60%; border-radius: 4px; margin-bottom: 6px; }
    .skeleton-text { height: 12px; width: 40%; border-radius: 4px; }

    .bim-card-foto { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 8px; border: 0.5px solid var(--border); transition: opacity 0.3s; }
    .bim-card-foto.laden { opacity: 0; }
    .bim-card-placeholder { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md); margin-bottom: 8px; border: 0.5px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--bg2); }
    .bim-card-num { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--orange); font-family: "Space Mono", monospace; line-height: 1; }
    .bim-card-serie { font-size: 10px; font-family: "Space Mono", monospace; color: var(--txt2); margin-top: 3px; }
    .bim-card-ort { font-size: 12px; color: var(--txt2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bim-card-date { font-size: 10px; font-family: "Space Mono", monospace; color: var(--txt2); margin-top: 4px; opacity: 0.7; }
    .bim-card-spotted { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-family: "Space Mono", monospace; background: var(--orange-light); color: var(--orange-dark); padding: 2px 8px; border-radius: 99px; margin-top: 5px; }
    .btn-del { position: absolute; top: 8px; right: 8px; background: transparent; border: none; cursor: pointer; color: var(--txt2); font-size: 13px; padding: 2px 4px; opacity: 0.35; transition: opacity 0.15s, color 0.15s; border-radius: 4px; }
    .btn-del:hover { opacity: 1; color: var(--danger); }

    /* ── MEILENSTEIN BANNER ── */
    .meilenstein { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .meilenstein.sichtbar { display: flex; animation: einblenden 0.3s ease; }
    .meilenstein-card { background: var(--bg); border-radius: var(--radius-lg); padding: 2rem; text-align: center; max-width: 300px; margin: 1rem; }
    .meilenstein-emoji { font-size: 48px; margin-bottom: 12px; }
    .meilenstein-titel { font-size: 22px; font-weight: 800; color: var(--orange); margin-bottom: 6px; }
    .meilenstein-text { font-size: 13px; font-family: "Space Mono", monospace; color: var(--txt2); margin-bottom: 1.25rem; }
    .meilenstein-btn { background: var(--orange); color: #fff; border: none; border-radius: var(--radius-md); padding: 10px 24px; font-family: "Syne", sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }

    /* ── TOAST ── */
    .toast { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%) translateY(-120px); background: var(--gruen); color: #fff; padding: 14px 24px; border-radius: var(--radius-lg); font-family: "Syne", sans-serif; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 999; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); text-align: center; white-space: nowrap; }
    .toast.sichtbar { transform: translateX(-50%) translateY(0); }
    .toast-sub { font-size: 12px; font-weight: 400; opacity: 0.85; margin-top: 2px; font-family: "Space Mono", monospace; }
  </style>
</head>
<body>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span id="toast-titel">🚋 Neue Bim entdeckt!</span>
    <div class="toast-sub" id="toast-sub"></div>
  </div>

  <!-- MEILENSTEIN POPUP -->
  <div class="meilenstein" id="meilenstein" onclick="schliesseMeilenstein()">
    <div class="meilenstein-card" onclick="event.stopPropagation()">
      <div class="meilenstein-emoji" id="ms-emoji">🎉</div>
      <div class="meilenstein-titel" id="ms-titel">Meilenstein!</div>
      <div class="meilenstein-text" id="ms-text"></div>
      <button class="meilenstein-btn" onclick="schliesseMeilenstein()">Weiter sammeln!</button>
    </div>
  </div>

  <!-- SEITE 1: LOGIN -->
  <div class="page aktiv" id="seite-auth">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-title">BimDex</div>
        <div class="auth-subtitle">Linz Straßenbahn Sammelpass</div>
        <div class="auth-tabs">
          <button class="auth-tab aktiv" onclick="authTab('login', this)">Anmelden</button>
          <button class="auth-tab" onclick="authTab('register', this)">Registrieren</button>
        </div>
        <div class="field"><label>E-Mail</label><input type="email" id="auth-email" placeholder="deine@email.com" /></div>
        <div class="field"><label>Passwort</label><input type="password" id="auth-passwort" placeholder="Mindestens 6 Zeichen" /></div>
        <button class="btn-primary" id="auth-btn" onclick="authAktion()">Anmelden</button>
        <div class="auth-error" id="auth-error"></div>
      </div>
    </div>
  </div>

  <!-- SEITE 2: APP -->
  <div class="page" id="seite-app">
    <div class="container">
      <div class="header">
        <div>
          <div class="title">BimDex</div>
          <div class="subtitle">Linz Straßenbahn Sammelpass</div>
        </div>
        <div class="header-rechts">
          <div class="stats">
            <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">gesammelt</div></div>
            <div class="stat"><div class="stat-num" id="s-missing">62</div><div class="stat-label">noch offen</div></div>
          </div>
          <button class="btn-logout" onclick="abmelden()">Abmelden (<span id="user-email"></span>)</button>
        </div>
      </div>

      <div class="progress-label" id="progress-label">0 von 62 Garnituren entdeckt</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>

      <div class="form-card">
        <div class="form-title">Bim eintragen / nochmals gesehen</div>
        <div class="form-row">
          <div class="form-group">
            <label>Nummer (Pflichtfeld)</label>
            <input type="number" id="inp-num" placeholder="z.B. 012" min="1" max="999" />
          </div>
          <div class="form-group">
            <label>Ort (optional)</label>
            <input type="text" id="inp-ort" placeholder="z.B. Hauptplatz" />
          </div>
          <div class="form-group">
            <label>Foto (beim 1. Mal Pflicht)</label>
            <input type="file" id="inp-foto" accept="image/*" capture="environment" onchange="fotoGewaehlt(this)" />
            <button class="btn-foto" id="btn-foto" onclick="document.getElementById('inp-foto').click()">📷 Foto aufnehmen</button>
            <img id="foto-vorschau" alt="Vorschau" />
            <!-- Upload-Fortschrittsbalken -->
            <div class="upload-bar-wrap" id="upload-bar-wrap">
              <div class="upload-bar-fill" id="upload-bar"></div>
            </div>
          </div>
          <button class="btn-add" id="btn-add" onclick="addBim()">+ Eintragen</button>
        </div>
        <div class="form-error" id="form-error"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Zeige:</span>
        <button class="filter-btn aktiv" onclick="setFilter('alle', this)">Alle</button>
        <button class="filter-btn" onclick="setFilter('gefunden', this)">Gefunden</button>
        <button class="filter-btn" onclick="setFilter('offen', this)">Noch offen</button>
      </div>

      <div id="grid-wrap"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://sgjjyjgbxrylrcofgpxg.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnamp5amdieHJ5bHJjb2ZncHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzkzNDIsImV4cCI6MjA5NTIxNTM0Mn0.OOr0tfDp3uunEd-8Y4sQRlo9SDdieJi7HB_ydr36Om0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SERIE_A = Array.from({length: 33}, (_, i) => ({ num: String(i+1).padStart(3,"0"), serie: "A" }));
    const SERIE_B = Array.from({length: 29}, (_, i) => ({ num: String(i+60).padStart(3,"0"), serie: "B" }));
    const ALLE_BIMS = [...SERIE_A, ...SERIE_B];

    // Meilensteine bei diesen Prozentzahlen
    const MEILENSTEINE = {
      25: { emoji: "🌱", titel: "25% geschafft!", text: "Du hast ein Viertel aller Linzer Bims entdeckt!" },
      50: { emoji: "⚡", titel: "Halbzeit!", text: "Die Hälfte aller 62 Garnituren sind in deinem Sammelpass!" },
      75: { emoji: "🔥", titel: "75%!", text: "Du bist ein echter Bim-Jäger – nur noch 15 Garnituren fehlen!" },
      100: { emoji: "🏆", titel: "Vollständig!", text: "Unglaublich – du hast alle 62 Linzer Bims entdeckt!" }
    };
    let erreichterMeilenstein = new Set();

    let aktiverNutzer = null;
    let aktiveFotoDatei = null;
    let alleEintraege = [];
    let aktiverFilter = "alle";
    let aktiveAuthAktion = "login";

    // Lokaler Cache: speichert Foto-URLs damit sie nicht neu geladen werden muessen
    const fotoCache = {};

    function zeigSeite(id) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("aktiv"));
      document.getElementById(id).classList.add("aktiv");
    }

    function authTab(aktion, btn) {
      aktiveAuthAktion = aktion;
      document.querySelectorAll(".auth-tab").forEach(b => b.classList.remove("aktiv"));
      btn.classList.add("aktiv");
      document.getElementById("auth-btn").textContent = aktion === "login" ? "Anmelden" : "Registrieren";
      document.getElementById("auth-error").textContent = "";
    }

    async function authAktion() {
      const email = document.getElementById("auth-email").value.trim();
      const passwort = document.getElementById("auth-passwort").value;
      const errEl = document.getElementById("auth-error");
      const btn = document.getElementById("auth-btn");
      errEl.textContent = "";
      if (!email || !passwort) { errEl.textContent = "Bitte E-Mail und Passwort eingeben."; return; }
      btn.disabled = true; btn.textContent = "...";
      let fehler;
      if (aktiveAuthAktion === "login") {
        ({ error: fehler } = await sb.auth.signInWithPassword({ email, password: passwort }));
      } else {
        ({ error: fehler } = await sb.auth.signUp({ email, password: passwort }));
      }
      if (fehler) {
        const m = { "Invalid login credentials": "E-Mail oder Passwort falsch.", "User already registered": "E-Mail bereits registriert.", "Password should be at least 6 characters": "Passwort mind. 6 Zeichen." };
        errEl.textContent = m[fehler.message] || fehler.message;
        btn.disabled = false;
        btn.textContent = aktiveAuthAktion === "login" ? "Anmelden" : "Registrieren";
      }
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        aktiverNutzer = session.user;
        document.getElementById("user-email").textContent = aktiverNutzer.email;
        zeigSeite("seite-app");
        ladeEintraege();
      } else {
        aktiverNutzer = null;
        alleEintraege = [];
        zeigSeite("seite-auth");
      }
    });

    async function abmelden() { await sb.auth.signOut(); }

    // ── BILD VERKLEINERN ──
    function bildVerkleinern(datei) {
      return new Promise(resolve => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = e => {
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxBreite = 1200;
            const scale = Math.min(1, maxBreite / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.8);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(datei);
      });
    }

    // ── FOTO GEWAEHLT ──
    async function fotoGewaehlt(input) {
      const datei = input.files[0];
      if (!datei) return;
      const fotoBtn = document.getElementById("btn-foto");
      fotoBtn.textContent = "⏳ Wird verkleinert...";
      aktiveFotoDatei = await bildVerkleinern(datei);
      const v = document.getElementById("foto-vorschau");
      v.src = URL.createObjectURL(aktiveFotoDatei);
      v.style.display = "block";
      fotoBtn.classList.add("hat-foto");
      fotoBtn.textContent = "✓ Foto aufgenommen";
    }

    // ── UPLOAD FORTSCHRITTSBALKEN animieren ──
    function animiereUpload() {
      const wrap = document.getElementById("upload-bar-wrap");
      const bar = document.getElementById("upload-bar");
      wrap.style.display = "block";
      bar.style.width = "0%";
      // Simulierter Fortschritt bis 90% – springt auf 100% wenn fertig
      let pct = 0;
      const interval = setInterval(() => {
        pct = Math.min(90, pct + Math.random() * 15);
        bar.style.width = pct + "%";
        if (pct >= 90) clearInterval(interval);
      }, 200);
      return { interval, bar, wrap };
    }

    // ── BIM EINTRAGEN ──
    async function addBim() {
      const numRaw = document.getElementById("inp-num").value.trim();
      const ort = document.getElementById("inp-ort").value.trim();
      const errEl = document.getElementById("form-error");
      const btn = document.getElementById("btn-add");
      errEl.textContent = "";

      if (!numRaw) { errEl.textContent = "Bitte eine Garniturnummer eingeben!"; return; }
      const numStr = String(parseInt(numRaw)).padStart(3, "0");
      if (!ALLE_BIMS.find(b => b.num === numStr)) { errEl.textContent = "Diese Garniturnummer existiert in Linz nicht."; return; }

      const vorhandener = alleEintraege.find(e => e.num === numStr);
      const istNeu = !vorhandener;
      if (istNeu && !aktiveFotoDatei) { errEl.textContent = "Beim ersten Spotting bitte ein Foto aufnehmen!"; return; }

      btn.disabled = true;
      btn.textContent = istNeu ? "📤 Wird hochgeladen..." : "Wird gespeichert...";

      let uploadTracker = null;

      try {
        if (istNeu) {
          // Upload-Fortschrittsbalken starten
          uploadTracker = animiereUpload();

          const dateiName = aktiverNutzer.id + "/" + numStr + "_" + Date.now() + ".jpg";
          const { error: uploadFehler } = await sb.storage.from("fotos").upload(dateiName, aktiveFotoDatei);
          if (uploadFehler) throw uploadFehler;

          // Fortschrittsbalken auf 100% setzen
          uploadTracker.bar.style.width = "100%";
          setTimeout(() => { uploadTracker.wrap.style.display = "none"; }, 600);

          const { data: urlData } = sb.storage.from("fotos").getPublicUrl(dateiName);
          const fotoUrl = urlData.publicUrl;
          fotoCache[numStr] = fotoUrl; // Im lokalen Cache speichern

          // Optimistic update: Eintrag sofort lokal hinzufuegen
          const neuerEintrag = { id: "temp-" + Date.now(), num: numStr, ort, foto_url: fotoUrl, datum: new Date().toLocaleDateString("de-AT"), spottings: 1, nutzer_id: aktiverNutzer.id };
          alleEintraege = [...alleEintraege, neuerEintrag].sort((a,b) => a.num.localeCompare(b.num));
          render();

          // Dann wirklich in Supabase speichern
          const { data: dbData, error: dbFehler } = await sb.from("bims").insert({
            num: numStr, ort, foto_url: fotoUrl,
            datum: new Date().toLocaleDateString("de-AT"),
            spottings: 1, nutzer_id: aktiverNutzer.id
          }).select().single();
          if (dbFehler) throw dbFehler;

          // Temp-Eintrag durch echten ersetzen
          alleEintraege = alleEintraege.map(e => e.id === neuerEintrag.id ? dbData : e);

        } else {
          const neueAnzahl = (vorhandener.spottings || 1) + 1;
          // Optimistic update
          alleEintraege = alleEintraege.map(e => e.id === vorhandener.id ? {...e, spottings: neueAnzahl} : e);
          render();
          const { error: dbFehler } = await sb.from("bims").update({ spottings: neueAnzahl }).eq("id", vorhandener.id);
          if (dbFehler) throw dbFehler;
        }

        zeigeToast(numStr, istNeu);
        pruefeMeilenstein();

        // Formular zuruecksetzen
        document.getElementById("inp-num").value = "";
        document.getElementById("inp-ort").value = "";
        document.getElementById("inp-foto").value = "";
        document.getElementById("foto-vorschau").style.display = "none";
        const fotoBtn = document.getElementById("btn-foto");
        fotoBtn.classList.remove("hat-foto");
        fotoBtn.textContent = "📷 Foto aufnehmen";
        aktiveFotoDatei = null;

      } catch(fehler) {
        errEl.textContent = "Fehler: " + fehler.message;
        if (uploadTracker) uploadTracker.wrap.style.display = "none";
        await ladeEintraege(); // Bei Fehler neu laden
      }

      btn.disabled = false;
      btn.textContent = "+ Eintragen";
    }

    // ── EINTRAEGE LADEN mit Skeleton ──
    async function ladeEintraege() {
      // Skeleton-Karten anzeigen waehrend geladen wird
      zeigSkeleton();
      const { data, error } = await sb.from("bims")
        .select("*").eq("nutzer_id", aktiverNutzer.id).order("num");
      if (error) { console.error("Ladefehler:", error); return; }
      alleEintraege = data;
      // Foto-URLs in Cache laden
      data.forEach(e => { if (e.foto_url) fotoCache[e.num] = e.foto_url; });
      render();
    }

    // Skeleton-Platzhalter waehrend Daten geladen werden
    function zeigSkeleton() {
      const skelett = Array.from({length: 12}, () =>
        `<div class="skeleton-karte">
          <div class="skeleton skeleton-foto"></div>
          <div class="skeleton skeleton-num"></div>
          <div class="skeleton skeleton-text"></div>
        </div>`
      ).join("");
      document.getElementById("grid-wrap").innerHTML =
        `<div class="serie-label">Wird geladen...</div><div class="grid">${skelett}</div>`;
    }

    // ── LOESCHEN ──
    async function deleteBim(id, num) {
      // Wenn die ID noch temporaer ist (optimistic update noch nicht abgeschlossen),
      // kurz warten und es nicht erlauben
      if (String(id).startsWith("temp-")) {
        alert("Bitte einen kurzen Moment warten – der Eintrag wird noch gespeichert.");
        return;
      }
      if (!confirm("Bim #" + num + " wirklich entfernen?")) return;
      // Optimistic update: beide als String vergleichen damit Zahlen-IDs korrekt gefunden werden
      alleEintraege = alleEintraege.filter(e => String(e.id) !== String(id));
      delete fotoCache[num];
      render();
      const { error } = await sb.from("bims").delete().eq("id", id);
      if (error) { alert("Fehler: " + error.message); await ladeEintraege(); }
    }

    // ── MEILENSTEIN PRUEFEN ──
    function pruefeMeilenstein() {
      const total = new Set(alleEintraege.map(e => e.num)).size;
      const pct = Math.round((total / 62) * 100);
      for (const [schwelle, info] of Object.entries(MEILENSTEINE)) {
        if (pct >= parseInt(schwelle) && !erreichterMeilenstein.has(schwelle)) {
          erreichterMeilenstein.add(schwelle);
          zeigMeilenstein(info);
          break;
        }
      }
    }

    function zeigMeilenstein(info) {
      document.getElementById("ms-emoji").textContent = info.emoji;
      document.getElementById("ms-titel").textContent = info.titel;
      document.getElementById("ms-text").textContent = info.text;
      document.getElementById("meilenstein").classList.add("sichtbar");
    }

    function schliesseMeilenstein() {
      document.getElementById("meilenstein").classList.remove("sichtbar");
    }

    // ── TOAST ──
    function zeigeToast(numStr, istNeu) {
      document.getElementById("toast-titel").textContent = istNeu ? "🚋 Neue Bim entdeckt!" : "👀 Nochmals gesehen!";
      document.getElementById("toast-sub").textContent = "Bim #" + numStr;
      const toast = document.getElementById("toast");
      toast.classList.add("sichtbar");
      setTimeout(() => toast.classList.remove("sichtbar"), 3000);
    }

    // ── FILTER ──
    function setFilter(f, btn) {
      aktiverFilter = f;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("aktiv"));
      btn.classList.add("aktiv");
      render();
    }

    // ── RENDER ──
    function render() {
      const gefundenNummern = new Set(alleEintraege.map(e => e.num));
      const total = gefundenNummern.size;
      const pct = Math.round((total / 62) * 100);
      document.getElementById("s-total").textContent = total;
      document.getElementById("s-missing").textContent = 62 - total;
      document.getElementById("progress-bar").style.width = pct + "%";
      document.getElementById("progress-label").textContent = total + " von 62 Garnituren entdeckt (" + pct + "%)";

      let liste = ALLE_BIMS;
      if (aktiverFilter === "gefunden") liste = ALLE_BIMS.filter(b => gefundenNummern.has(b.num));
      if (aktiverFilter === "offen") liste = ALLE_BIMS.filter(b => !gefundenNummern.has(b.num));

      const serieA = liste.filter(b => b.serie === "A");
      const serieB = liste.filter(b => b.serie === "B");

      let html = "";
      if (serieA.length > 0) {
        html += '<div class="serie-label">Serie A · 001–033 · Cityrunner alt (orange/weiss)</div><div class="grid">';
        html += serieA.map(b => karteHTML(b)).join("") + "</div>";
      }
      if (serieB.length > 0) {
        html += '<div class="serie-label" style="margin-top:1.5rem">Serie B · 060–088 · Cityrunner neu (grau/orange)</div><div class="grid">';
        html += serieB.map(b => karteHTML(b)).join("") + "</div>";
      }
      if (!html) html = '<div style="text-align:center;padding:2rem;font-family:Space Mono,monospace;font-size:13px;color:var(--txt2)">Keine Bims in dieser Ansicht.</div>';
      document.getElementById("grid-wrap").innerHTML = html;
    }

    // ── KARTE HTML ──
    function karteHTML(bim) {
      const e = alleEintraege.find(x => x.num === bim.num);
      if (e) {
        // Gecachte URL verwenden falls vorhanden
        const url = fotoCache[bim.num] || e.foto_url;
        return '<div class="bim-card gefunden">' +
          '<button class="btn-del" onclick="deleteBim(\'' + e.id + '\',\'' + bim.num + '\')" title="Loeschen">✕</button>' +
          (url ? '<img class="bim-card-foto laden" src="' + url + '" alt="Bim ' + bim.num + '" onload="this.classList.remove(\'laden\')" />' : "") +
          '<div class="bim-card-num">#' + bim.num + '</div>' +
          '<div class="bim-card-serie">' + (bim.serie === "A" ? "🟠 alt" : "⬜ neu") + '</div>' +
          (e.ort ? '<div class="bim-card-ort">' + e.ort + '</div>' : "") +
          '<div class="bim-card-date">' + (e.datum || "") + '</div>' +
          (e.spottings > 1 ? '<div class="bim-card-spotted">👁 ' + e.spottings + 'x gesehen</div>' : "") +
          '</div>';
      } else {
        return '<div class="bim-card offen" onclick="wackeln(this)">' +
          '<div class="bim-card-placeholder">🚋</div>' +
          '<div class="bim-card-num">#' + bim.num + '</div>' +
          '<div class="bim-card-serie">' + (bim.serie === "A" ? "🟠 alt" : "⬜ neu") + '</div>' +
          '</div>';
      }
    }

    // Wackel-Animation fuer offene Karten beim Antippen
    function wackeln(el) {
      el.classList.remove("wackeln");
      void el.offsetWidth; // Animation neu starten erzwingen
      el.classList.add("wackeln");
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.getElementById("seite-app").classList.contains("aktiv")) addBim();
    });
  </script>
</body>
</html>
